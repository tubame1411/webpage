<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取扱説明書（マニュアル）へ移動中 - CW Log</title>
  <meta http-equiv="refresh" content="0; url=docs/manual.html">
  <script>
    // 即時リダイレクト
    window.location.replace("docs/manual.html");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .redirect-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>取扱説明書（マニュアル）へ移動しています</h1>
    <p>自動的に新しいマニュアルページへ転送されます。<br>自動で切り替わらない場合は、下記のボタンをクリックしてください。</p>
    <a href="docs/manual.html" class="btn">マニュアルを開く</a>
  </div>
</body>
</html>
